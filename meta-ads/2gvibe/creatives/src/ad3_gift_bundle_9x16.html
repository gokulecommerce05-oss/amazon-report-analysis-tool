<html><head><link rel="stylesheet" href="base.css"><link rel="stylesheet" href="fun.css"><style>
body{background:linear-gradient(160deg,#3b2410 0%,#5a3818 60%,#7a4a22 100%);padding:230px 64px 300px;display:flex;flex-direction:column;color:#fff}
.brand{color:var(--gold2)}
.top{display:flex;justify-content:space-between;align-items:center}
.kicker{background:var(--gold);color:var(--brown)}
.h1{font-size:88px;color:#fff;margin:34px 0 6px}
.h1 em{color:#FFC93C}
.sub{font-size:30px;color:#ead9bd;margin-bottom:28px}
.duo{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:22px;position:relative}
.duo .card{display:flex;align-items:center;justify-content:center;background:#fffaf0}
.duo img{width:100%;height:100%;object-fit:cover;object-position:88% center}
.plus{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:96px;height:96px;border-radius:50%;background:var(--gold);color:var(--brown);font-weight:800;font-size:64px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.perks{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:28px}
.perk{background:rgba(255,255,255,.1);border:2px solid var(--gold);border-radius:24px;padding:18px 22px;font-size:30px;font-weight:700;color:#fff}
.perk span{display:block;font-size:22px;font-weight:400;color:#ead9bd}
.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
.price{font-size:64px;color:#fff}.price small{color:#FFC93C}
.cta{background:var(--gold);color:var(--brown)}
</style></head><body>
<div class="top"><div class="brand"><img src="../../assets/site/logo_0.png">2G VIBE</div><div class="kicker">GIFT SET 🎁</div></div>
<div class="h1">One for you, <em>one to gift</em></div>
<div class="sub">Pick any 2 wind chimes · housewarming · wedding · festive</div>
<div class="duo"><div class="card"><img src="../../assets/site/elephant_1.jpg"></div><div class="card"><img src="../../assets/site/butterfly_1.jpg"></div><div class="plus">+</div></div>
<div class="perks"><div class="perk">🚚 FREE Shipping<span>on orders above ₹1,000</span></div><div class="perk">🎁 FREE Gift<span>on orders above ₹1,200</span></div></div>
<div class="bottom"><div class="price"><small>2 chimes</small>₹1,398</div><div class="cta">Shop Now →</div></div>
</body></html>
